# Declarative replacement for build_lin.sh — start with:
#
#   ./jetson docker up --build                # canonical workspace (default)
#   ./jetson --member ~/.config/tfc/compose.env docker up   # a member's own clone
#
# jetson sources /opt/tfc-autonomous/config/tfc_paths.env (generated by
# setup_jetson.py), so every ${TFC_*} variable below is resolved from the machine
# env file and no path is hard-coded. TFC_PROJECT / TFC_CONTAINER_NAME make
# per-member instances collision-free (see JETSON_ORGANIZATION.md). TFC_WS
# overrides the mounted workspace. The image is built from this directory's
# Dockerfile (build: section), tagged jetson-orin-ros2-jazzy.

name: ${TFC_PROJECT:-tfc-autonomous}

services:
  tfc-autonomous:
    image: jetson-orin-ros2-jazzy
    build:
      context: .
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
        WORKSPACE: /workspace
    container_name: ${TFC_CONTAINER_NAME:-tfc-autonomous}
    privileged: true
    runtime: nvidia
    restart: unless-stopped
    network_mode: host
    stdin_open: true
    tty: true
    environment:
      DISPLAY: ${DISPLAY:-}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      XDG_RUNTIME_DIR: /tmp/runtime-root
      XAUTHORITY: /root/.Xauthority
    volumes:
      - ${TFC_WS}:/workspace
      - ${TFC_ROOT}:${TFC_ROOT}
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /tmp:/tmp:rw
      - /var/nvidia/nvcam/settings:/var/nvidia/nvcam/settings:ro
      - /etc/systemd/system/zed_x_daemon.service:/etc/systemd/system/zed_x_daemon.service:ro
      - ${HOME:-/root}/.Xauthority:/root/.Xauthority
      - /var/run/argus-daemon:/var/run/argus-daemon:rw
    devices:
      - /dev/video0
      - /dev/video1
      - /dev/dri:/dev/dri
      - /dev:/dev
    working_dir: /workspace
    command: bash -lc "source '${TFC_CONFIG_DIR}/tfc_paths.env' 2>/dev/null || true; source /opt/ros/${ROS_DISTRO:-jazzy}/setup.bash 2>/dev/null || true; [ -f install/setup.bash ] && source install/setup.bash 2>/dev/null || true; exec bash"